# One-off: hand the signing key back to its owner.
#
# The keystore exists only in this repository's secrets, which are write-only —
# there is no API that returns a value, so the single way to get a copy is to
# let a runner decode it and upload the result.
#
# Run this ONLY while the repository is private. On a public repository the
# artifact below is downloadable by anyone, and a leaked signing key cannot be
# rotated: whoever holds it can sign an APK that installs silently over Bastion.
#
# Delete this workflow, and the artifact, as soon as the copy is safely down.
name: Export keystore (one-off)

on:
  workflow_dispatch:

jobs:
  export:
    name: Decode the keystore
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on a public repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::This repository is public. An artifact here would publish the signing key."
            exit 1
          fi
          echo "Repository is private; continuing."

      - name: Decode
        env:
          KEYSTORE_BASE64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BASTION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::BASTION_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > out/bastion-release.jks
          # The same shape Gradle reads, so this folder can be dropped straight
          # back into a checkout as keystore.properties.
          {
            echo "storeFile=bastion-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > out/keystore.properties
          ls -l out

      - name: Prove it is the right key before handing it over
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)
          KEYTOOL=$(dirname "$(readlink -f "$(command -v keytool)")")/keytool
          echo "Certificate in the decoded keystore:"
          "$KEYTOOL" -list -v \
            -keystore out/bastion-release.jks \
            -storepass "${{ secrets.BASTION_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.BASTION_KEY_ALIAS }}" 2>/dev/null \
            | grep -i "SHA256:" || echo "  could not read certificate"

      - uses: actions/upload-artifact@v4
        with:
          name: bastion-keystore
          path: out/*
          retention-days: 1
          if-no-files-found: error
